[build]
  base = "apps/web"
  command = "pnpm --filter @aureon/api build && pnpm --filter @aureon/api bundle:serverless && pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Serves the Next.js app (SSR + prerendered pages) on Netlify.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"
  # Native password-hashing binding: shipped as files, not bundled.
  external_node_modules = ["@node-rs/argon2", "@node-rs/argon2-linux-x64-gnu"]
