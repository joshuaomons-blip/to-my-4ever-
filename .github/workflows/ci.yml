name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4
        env: { POSTGRES_USER: aureon, POSTGRES_PASSWORD: aureon, POSTGRES_DB: aureon_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U aureon" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck all packages
        run: pnpm -r typecheck
      - name: API tests (unit + integration against Postgres/Redis)
        run: pnpm --filter @aureon/api test
        env:
          TEST_DATABASE_URL: postgres://aureon:aureon@localhost:5432/aureon_test
          TEST_REDIS_URL: redis://localhost:6379/15
      - name: OpenAPI document is current
        run: |
          pnpm --filter @aureon/api openapi
          git diff --exit-code docs/api/openapi.json || (echo "::error::Run 'pnpm --filter @aureon/api openapi' and commit docs/api/openapi.json" && exit 1)
        env:
          DATABASE_URL: postgres://aureon:aureon@localhost:5432/aureon_test
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SANDBOX_PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-123456

  build:
    name: Build apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aureon/api build
      - run: pnpm --filter @aureon/web build
      - run: pnpm --filter @aureon/admin build

  e2e:
    name: End-to-end (Playwright, sandbox stack)
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.4
        env: { POSTGRES_USER: aureon, POSTGRES_PASSWORD: aureon, POSTGRES_DB: aureon_e2e }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U aureon" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4
        ports: ['6379:6379']
    env:
      # NODE_ENV deliberately unset: `next build` fails under a non-production NODE_ENV,
      # and the API defaults to its development (sandbox) configuration when unset.
      DATABASE_URL: postgres://aureon:aureon@localhost:5432/aureon_e2e
      REDIS_URL: redis://localhost:6379
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SANDBOX_PAYMENT_WEBHOOK_SECRET: e2e-webhook-secret-123456
      EXPOSE_DEV_MAILBOX: 'true'
      RUN_WORKER_IN_PROCESS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aureon/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @aureon/api build && pnpm --filter @aureon/web build
      - run: node apps/api/dist/database/migrate.js && node apps/api/dist/database/seed.js
      - name: Start API and web
        run: |
          (cd apps/api && nohup node dist/main.js > api.log 2>&1 &)
          (cd apps/web && nohup npx next start -p 3000 > web.log 2>&1 &)
          npx --yes wait-on@8.0.1 -t 60000 http://localhost:4000/readyz http://localhost:3000
      - run: pnpm --filter @aureon/e2e test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
            apps/api/api.log

  security:
    name: Dependency & secret scanning
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (fail on high/critical)
        run: pnpm audit --prod --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
